<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#ffffff"/>
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Automatisation n8n — rapport quotidien du stock (Centre de Santé Cherrat)</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#475569">déclencheur → traitement → IA → intégration externe → résultat</text>

  <!-- column headers -->
  <g font-size="12" font-weight="bold" fill="#64748b" text-anchor="middle">
    <text x="105" y="100">1. DÉCLENCHEUR</text>
    <text x="345" y="100">2. TRAITEMENT (code)</text>
    <text x="625" y="100">3. IA GÉNÉRATIVE</text>
    <text x="885" y="100">4. INTÉGRATION</text>
    <text x="1095" y="100">5. RÉSULTAT</text>
  </g>

  <!-- 1 trigger -->
  <rect x="25" y="120" width="160" height="70" rx="10" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="105" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#0c4a6e">Schedule Trigger</text>
  <text x="105" y="170" text-anchor="middle" font-size="12" fill="#0c4a6e">chaque jour 8 h 15</text>
  <rect x="25" y="210" width="160" height="50" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-dasharray="4 3"/>
  <text x="105" y="240" text-anchor="middle" font-size="13" fill="#0c4a6e">Test manuel (démo)</text>

  <!-- 2 processing -->
  <rect x="245" y="120" width="200" height="60" rx="10" fill="#f1f5f9" stroke="#475569"/>
  <text x="345" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Configuration</text>
  <text x="345" y="165" text-anchor="middle" font-size="11" fill="#334155">URL de l'API, URL d'Ollama, modèle</text>

  <rect x="245" y="200" width="200" height="74" rx="10" fill="#f1f5f9" stroke="#475569"/>
  <text x="345" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">API FastAPI</text>
  <text x="345" y="243" text-anchor="middle" font-size="11" fill="#334155">GET /automation/rapport</text>
  <text x="345" y="260" text-anchor="middle" font-size="11" fill="#334155">en-tête X-API-Key → PostgreSQL</text>

  <rect x="245" y="294" width="200" height="74" rx="10" fill="#f1f5f9" stroke="#475569"/>
  <text x="345" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Préparer le prompt</text>
  <text x="345" y="337" text-anchor="middle" font-size="11" fill="#334155">faits en texte + synthèse chiffrée</text>
  <text x="345" y="354" text-anchor="middle" font-size="11" fill="#334155">(calculs faits par le code)</text>

  <rect x="265" y="390" width="160" height="56" rx="28" fill="#fef9c3" stroke="#a16207"/>
  <text x="345" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">IF nb_alertes &gt; 0</text>
  <text x="345" y="432" text-anchor="middle" font-size="11" fill="#713f12">sinon : « aucune alerte »</text>

  <!-- 3 AI -->
  <rect x="525" y="300" width="200" height="90" rx="10" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="625" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">Ollama (local)</text>
  <text x="625" y="345" text-anchor="middle" font-size="11" fill="#4c1d95">POST /api/generate</text>
  <text x="625" y="362" text-anchor="middle" font-size="11" fill="#4c1d95">llama3.2:3b · température 0,1</text>
  <text x="625" y="379" text-anchor="middle" font-size="11" fill="#4c1d95">rédige la liste d'actions</text>

  <rect x="525" y="430" width="200" height="56" rx="10" fill="#ffedd5" stroke="#b45309"/>
  <text x="625" y="454" text-anchor="middle" font-size="13" font-weight="bold" fill="#7c2d12">Repli sans IA</text>
  <text x="625" y="472" text-anchor="middle" font-size="11" fill="#7c2d12">si Ollama échoue : données brutes</text>

  <rect x="525" y="200" width="200" height="74" rx="10" fill="#f1f5f9" stroke="#475569"/>
  <text x="625" y="224" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Mettre en forme</text>
  <text x="625" y="243" text-anchor="middle" font-size="11" fill="#334155">rapport : synthèse + actions IA</text>
  <text x="625" y="260" text-anchor="middle" font-size="11" fill="#334155">+ données vérifiables</text>

  <!-- 4 integration -->
  <rect x="790" y="250" width="190" height="80" rx="10" fill="#dcfce7" stroke="#15803d"/>
  <text x="885" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">API - Publier le rapport</text>
  <text x="885" y="297" text-anchor="middle" font-size="11" fill="#14532d">POST /automation/rapport-ia</text>
  <text x="885" y="314" text-anchor="middle" font-size="11" fill="#14532d">→ table rapports_ia</text>

  <!-- 5 result -->
  <rect x="1020" y="230" width="160" height="120" rx="10" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="1100" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#134e4a">Tableau de bord</text>
  <text x="1100" y="278" text-anchor="middle" font-size="11" fill="#134e4a">Docteur, Major, Infirmier</text>
  <text x="1100" y="304" text-anchor="middle" font-size="11" fill="#134e4a">→ décision humaine :</text>
  <text x="1100" y="321" text-anchor="middle" font-size="11" fill="#134e4a">retrait, commande</text>
  <text x="1100" y="338" text-anchor="middle" font-size="11" fill="#134e4a">(HITL)</text>

  <!-- arrows -->
  <g stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#fl)">
    <path d="M185 155 H243"/>
    <path d="M185 235 H215 V160 H243"/>
    <path d="M345 180 V198"/>
    <path d="M345 274 V292"/>
    <path d="M345 368 V388"/>
    <path d="M425 418 H475 V345 H523"/>
    <path d="M625 300 V276"/>
    <path d="M725 237 H755 V280 H788"/>
    <path d="M980 290 H1018"/>
  </g>
  <g stroke="#b45309" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#fr)">
    <path d="M700 390 V428"/>
    <path d="M725 458 H760 V310 H788"/>
  </g>

  <!-- data labels -->
  <g font-size="10.5" fill="#0f172a">
    <rect x="450" y="200" width="68" height="34" rx="4" fill="#fff" stroke="#cbd5e1"/>
    <text x="456" y="214">JSON :</text>
    <text x="456" y="228">ruptures…</text>
    <text x="434" y="382" fill="#475569">prompt + faits</text>
    <text x="732" y="228" fill="#475569">{synthèse, actions…}</text>
    <text x="982" y="282" fill="#475569">rapport</text>
    <text x="708" y="416" fill="#b45309">erreur / délai</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#334155">
    <rect x="25" y="512" width="14" height="14" fill="#f1f5f9" stroke="#475569"/><text x="45" y="523">Traitement déterministe (code)</text>
    <rect x="245" y="512" width="14" height="14" fill="#ede9fe" stroke="#6d28d9"/><text x="265" y="523">IA générative locale</text>
    <rect x="405" y="512" width="14" height="14" fill="#dcfce7" stroke="#15803d"/><text x="425" y="523">Intégration (API)</text>
    <rect x="545" y="512" width="14" height="14" fill="#ffedd5" stroke="#b45309"/><text x="565" y="523">Mécanisme de repli</text>
    <text x="720" y="523">Tout reste en local, aucune donnée patient ne circule.</text>
  </g>
</svg>
